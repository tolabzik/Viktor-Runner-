name: viktor-runner
services:
  game:
    build: .
    image: viktor-runner:2.0.0
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - records:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  records:
