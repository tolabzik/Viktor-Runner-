name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: API regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: for f in public/*.js; do node --check "$f"; done
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: HTTP smoke test
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/health
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'VIKTOR RUNNER'
          curl --fail --silent http://127.0.0.1:8080/assets/hero.webp -o /tmp/hero.webp
          test -s /tmp/hero.webp
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
